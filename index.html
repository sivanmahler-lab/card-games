<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הלובי — משחקי קלפים</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Shared "Luxury Card Club" design tokens — see js/ui/theme.css and
     docs/premium-platform-proposal.md §1-2. Kept as a separate stylesheet (not inlined) so
     whist.html/sheshiyot.html can eventually link the same file and the three pages stay
     visually in sync from one source instead of drifting apart over time. -->
<link rel="stylesheet" href="js/ui/theme.css">
<!-- PWA: lets the site be installed to the home screen as an app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d2b22">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קלפים">
<style>
  /* Page-specific styling only lives here — shared color/typography tokens and the .luxury-card
     component come from js/ui/theme.css above. */
  *{box-sizing:border-box;}
  @keyframes emblemGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(240,216,150,.35));}50%{filter:drop-shadow(0 0 16px rgba(240,216,150,.65));}}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  body{
    margin:0;min-height:100vh;font-family:'Heebo',sans-serif;color:var(--cream);
    position:relative;
    background:
               repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 5px),
               radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.06), transparent 55%),
               radial-gradient(circle at 50% 50%, var(--felt-3) 0%, var(--felt-2) 55%, var(--felt-1) 100%);
    display:flex;flex-direction:column;align-items:center;padding:40px 16px;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    box-shadow:inset 0 0 160px rgba(0,0,0,.55);
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.35) 100%);
  }
  body > *{position:relative;z-index:1;}
  h1{font-family:'Frank Ruhl Libre',serif;font-size:38px;color:var(--gold-bright);margin:0 0 6px;text-shadow:0 0 22px rgba(240,216,150,.3);}
  .sub{color:rgba(250,244,230,.65);margin-bottom:36px;font-size:14px;letter-spacing:.5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;max-width:800px;width:100%;}

  /* Game cards reuse .luxury-card from theme.css for the glass/hover treatment, and add only
     the layout/content styling specific to a lobby tile (padding, the shine sweep, spacing for
     the icon/title/subtitle stack). */
  a.card{
    text-decoration:none;color:inherit;
    padding:26px 18px;text-align:center;
    position:relative;overflow:hidden;
    opacity:0;animation:cardIn .55s ease forwards;
  }
  .grid a.card:nth-child(1){animation-delay:.05s;}
  .grid a.card:nth-child(2){animation-delay:.18s;}
  /* Soft top-down gold sheen inside the glass, on top of theme.css's own frosted background —
     gives the panel a sense of depth/light-from-above instead of a flat tint. */
  a.card::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg, rgba(240,216,150,.10), transparent 45%);
  }
  /* The hover "shine sweep" — a diagonal light band that travels across the card. Separate
     layer from ::before (used for the static top-light) since both need to coexist. */
  a.card::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);
    transform:translateX(-120%);transition:transform .6s ease;
  }
  a.card:hover::after{transform:translateX(120%);}
  .ic{margin-bottom:10px;display:flex;align-items:center;justify-content:center;height:52px;position:relative;}
  .ic svg{height:100%;width:auto;overflow:visible;transition:filter .25s, transform .25s;}
  a.card:hover .ic svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));transform:scale(1.05);}
  a.card h3{margin:0 0 4px;font-size:18px;color:var(--cream);font-family:'Frank Ruhl Libre',serif;}
  a.card p{margin:0;font-size:12.5px;color:var(--gold-dim);}
  h1.brand-title{display:flex;align-items:center;gap:12px;justify-content:center;}
  h1.brand-title svg{height:40px;width:auto;animation:emblemGlow 3.2s ease-in-out infinite;}

  @media (prefers-reduced-motion: reduce){
    a.card{opacity:1;animation:none;}
    h1.brand-title svg{animation:none;}
  }
</style>
</head>
<body>
  <h1 class="brand-title">
    <!-- Lobby emblem: a spade pip resting on a poker chip, gold-on-felt -->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="34" r="26" fill="none" stroke="#d4af5a" stroke-width="3"/>
      <circle cx="32" cy="34" r="19" fill="none" stroke="#d4af5a" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M32 14c9 8 15 15 15 21a9 9 0 0 1-13 8 6 6 0 0 0 4 6h-12a6 6 0 0 0 4-6 9 9 0 0 1-13-8c0-6 6-13 15-21z"
        fill="#f0d896" stroke="#211a10" stroke-width="1"/>
    </svg>
    הלובי
  </h1>
  <div class="sub">בחרו משחק</div>
  <div class="grid">
    <a class="card luxury-card" href="whist.html">
      <div class="ic">
        <!-- Whist: a fanned hand of 13 card-backs -->
        <svg viewBox="0 0 200 100" aria-hidden="true">
          <g stroke="#d4af5a" stroke-width="1">
            <!-- 13 cards fanned across ~100deg, drawn back-to-front -->
            <g id="whist-fan"></g>
          </g>
        </svg>
      </div>
      <h3>וויסט</h3>
      <p>חוזים, שליטים ולקיחות</p>
    </a>
    <a class="card luxury-card" href="sheshiyot.html">
      <div class="ic">
        <!-- Sheshiyot: six face-up cards with polished vector suit glyphs (paths, not emoji —
             emoji rendering varies wildly across OS/browser font sets, while these paths render
             identically everywhere and can be recolored/animated like any other vector shape). -->
        <svg viewBox="0 0 150 70" aria-hidden="true">
          <defs>
            <!-- Reusable suit glyphs, each drawn once and instanced via <use> below at whatever
                 position/color is needed — avoids repeating the same path data six times. -->
            <g id="suit-heart"><path d="M0,3.2 C0,-1 -4.6,-1 -4.6,2 C-4.6,5 0,8.4 0,10.5 C0,8.4 4.6,5 4.6,2 C4.6,-1 0,-1 0,3.2 Z"/></g>
            <g id="suit-spade"><path d="M0,-6.5 C3.4,-3 5.2,-0.6 5.2,2.2 A3.4,3.4 0 0 1 0.6,5.4 A2.2,2.2 0 0 0 2.8,7.6 H-2.8 A2.2,2.2 0 0 0 -0.6,5.4 A3.4,3.4 0 0 1 -5.2,2.2 C-5.2,-0.6 -3.4,-3 0,-6.5 Z"/></g>
            <g id="suit-diamond"><path d="M0,-6.6 L4.6,0 L0,6.6 L-4.6,0 Z"/></g>
            <g id="suit-club"><path d="M0,-2 A2.7,2.7 0 1 1 2.4,2.1 A2.7,2.7 0 1 1 0.6,-1.4 A2.7,2.7 0 1 1 -2.4,2.1 A2.7,2.7 0 1 1 -0.6,-1.4 C-1,0.5 -1.6,2.4 -3,5.2 H3 C1.6,2.4 1,0.5 0,-2 Z"/></g>
          </defs>
          <g stroke="#211a10" stroke-width="1.5">
            <rect x="4"  y="2"  width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="62" y="2"  width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="120" y="2" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="4"  y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="62" y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="120" y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
          </g>
          <use href="#suit-heart"   x="17"  y="17" fill="#c0272d"/>
          <use href="#suit-spade"   x="75"  y="17" fill="#1a1a1a"/>
          <use href="#suit-diamond" x="133" y="17" fill="#c0272d"/>
          <use href="#suit-club"    x="17"  y="53" fill="#1a1a1a"/>
          <use href="#suit-heart"   x="75"  y="53" fill="#c0272d"/>
          <use href="#suit-spade"   x="133" y="53" fill="#1a1a1a"/>
        </svg>
      </div>
      <h3>שישיות</h3>
      <p>שישה קלפים, כמה שפחות נקודות</p>
    </a>
    <!-- להוספת משחק חדש: פשוט מעתיקים כרטיס כזה ומצביעים ל-html החדש -->
  </div>
  <script>
    // Build the Whist fan programmatically: 13 card-backs rotated evenly across ~100deg,
    // pivoting from a point below the fan so they spread like a real hand of cards.
    (function(){
      const g = document.getElementById('whist-fan');
      const n = 13, spread = 108, pivotX = 100, pivotY = 150, cardW = 20, cardH = 36;
      for(let i=0;i<n;i++){
        const angle = -spread/2 + (spread/(n-1))*i;
        const wrap = document.createElementNS('http://www.w3.org/2000/svg','g');
        wrap.setAttribute('transform', `rotate(${angle} ${pivotX} ${pivotY})`);
        const card = document.createElementNS('http://www.w3.org/2000/svg','rect');
        card.setAttribute('x', pivotX - cardW/2);
        card.setAttribute('y', pivotY - cardH - 56);
        card.setAttribute('width', cardW);
        card.setAttribute('height', cardH);
        card.setAttribute('rx', 3);
        card.setAttribute('fill', i%2===0 ? '#8a1f2b' : '#6e1720');
        card.setAttribute('stroke', '#f0d896');
        card.setAttribute('stroke-width', '0.75');
        wrap.appendChild(card);
        // a small diamond motif on each card back, like a real card-back pattern
        const motif = document.createElementNS('http://www.w3.org/2000/svg','circle');
        motif.setAttribute('cx', pivotX);
        motif.setAttribute('cy', pivotY - 56 - cardH/2);
        motif.setAttribute('r', 3.2);
        motif.setAttribute('fill', '#f0d896');
        motif.setAttribute('opacity', '0.85');
        wrap.appendChild(motif);
        g.appendChild(wrap);
      }
    })();
  </script>
  <script>
    // PWA: register the service worker so the app shell can be installed / opened
    // offline. Safe to skip silently if unsupported (older browsers, non-https, etc).
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
