<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הלובי — משחקי קלפים</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-1:#0d2b22; --felt-2:#164434; --felt-3:#1f5a44;
    --gold:#d4af5a; --gold-bright:#f0d896; --cream:#faf4e6; --ink:#211a10;
  }
  *{box-sizing:border-box;}
  @keyframes feltShimmer{0%,100%{opacity:.5;}50%{opacity:.85;}}
  @keyframes emblemGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(240,216,150,.35));}50%{filter:drop-shadow(0 0 16px rgba(240,216,150,.65));}}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  body{
    margin:0;min-height:100vh;font-family:'Heebo',sans-serif;color:var(--cream);
    position:relative;
    background:
               repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 5px),
               radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.06), transparent 55%),
               radial-gradient(circle at 50% 50%, var(--felt-3) 0%, var(--felt-2) 55%, var(--felt-1) 100%);
    display:flex;flex-direction:column;align-items:center;padding:40px 16px;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    box-shadow:inset 0 0 160px rgba(0,0,0,.55);
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.35) 100%);
  }
  body > *{position:relative;z-index:1;}
  h1{font-family:'Frank Ruhl Libre',serif;font-size:38px;color:var(--gold-bright);margin:0 0 6px;text-shadow:0 0 22px rgba(240,216,150,.3);}
  .sub{color:rgba(250,244,230,.65);margin-bottom:36px;font-size:14px;letter-spacing:.5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;max-width:800px;width:100%;}
  a.card{
    text-decoration:none;color:inherit;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
    border:1px solid rgba(212,175,90,.35);border-radius:14px;padding:26px 18px;text-align:center;
    transition:.22s cubic-bezier(.2,.7,.3,1); position:relative;overflow:hidden;
    box-shadow:0 0 0 1px rgba(212,175,90,.08) inset;
    opacity:0;animation:cardIn .55s ease forwards;
  }
  .grid a.card:nth-child(1){animation-delay:.05s;}
  .grid a.card:nth-child(2){animation-delay:.18s;}
  a.card::before{
    content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
    transform:translateX(-120%);transition:transform .6s ease;pointer-events:none;
  }
  a.card:hover::before{transform:translateX(120%);}
  a.card:hover{border-color:var(--gold-bright);transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 1px rgba(212,175,90,.25) inset;}
  .ic{margin-bottom:10px;display:flex;align-items:center;justify-content:center;height:52px;}
  .ic svg{height:100%;width:auto;overflow:visible;transition:filter .25s;}
  a.card:hover .ic svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  a.card h3{margin:0 0 4px;font-size:18px;color:var(--cream);font-family:'Frank Ruhl Libre',serif;}
  a.card p{margin:0;font-size:12.5px;color:rgba(250,244,230,.6);}
  h1.brand-title{display:flex;align-items:center;gap:12px;justify-content:center;}
  h1.brand-title svg{height:40px;width:auto;animation:emblemGlow 3.2s ease-in-out infinite;}
</style>
</head>
<body>
  <h1 class="brand-title">
    <!-- Lobby emblem: a spade pip resting on a poker chip, gold-on-felt -->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="34" r="26" fill="none" stroke="#d4af5a" stroke-width="3"/>
      <circle cx="32" cy="34" r="19" fill="none" stroke="#d4af5a" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M32 14c9 8 15 15 15 21a9 9 0 0 1-13 8 6 6 0 0 0 4 6h-12a6 6 0 0 0 4-6 9 9 0 0 1-13-8c0-6 6-13 15-21z"
        fill="#f0d896" stroke="#211a10" stroke-width="1"/>
    </svg>
    הלובי
  </h1>
  <div class="sub">בחרו משחק</div>
  <div class="grid">
    <a class="card" href="whist.html">
      <div class="ic">
        <!-- Whist: a fanned hand of 13 card-backs -->
        <svg viewBox="0 0 200 100" aria-hidden="true">
          <g stroke="#d4af5a" stroke-width="1">
            <!-- 13 cards fanned across ~100deg, drawn back-to-front -->
            <g id="whist-fan"></g>
          </g>
        </svg>
      </div>
      <h3>וויסט</h3>
      <p>חוזים, שליטים ולקיחות</p>
    </a>
    <a class="card" href="sheshiyot.html">
      <div class="ic">
        <!-- Sheshiyot: six face-up cards, 3 over 3 -->
        <svg viewBox="0 0 150 70" aria-hidden="true">
          <g stroke="#211a10" stroke-width="1.5">
            <rect x="4"  y="2"  width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="62" y="2"  width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="120" y="2" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="4"  y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="62" y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
            <rect x="120" y="38" width="26" height="30" rx="3" fill="#faf4e6"/>
          </g>
          <g font-family="Heebo, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
            <text x="17"  y="19" fill="#c0272d">♥</text>
            <text x="75"  y="19" fill="#1a1a1a">♠</text>
            <text x="133" y="19" fill="#c0272d">♦</text>
            <text x="17"  y="55" fill="#1a1a1a">♣</text>
            <text x="75"  y="55" fill="#c0272d">♥</text>
            <text x="133" y="55" fill="#1a1a1a">♠</text>
          </g>
        </svg>
      </div>
      <h3>שישיות</h3>
      <p>שישה קלפים, כמה שפחות נקודות</p>
    </a>
    <!-- להוספת משחק חדש: פשוט מעתיקים כרטיס כזה ומצביעים ל-html החדש -->
  </div>
  <script>
    // Build the Whist fan programmatically: 13 card-backs rotated evenly across ~100deg,
    // pivoting from a point below the fan so they spread like a real hand of cards.
    (function(){
      const g = document.getElementById('whist-fan');
      const n = 13, spread = 108, pivotX = 100, pivotY = 150, cardW = 20, cardH = 36;
      for(let i=0;i<n;i++){
        const angle = -spread/2 + (spread/(n-1))*i;
        const wrap = document.createElementNS('http://www.w3.org/2000/svg','g');
        wrap.setAttribute('transform', `rotate(${angle} ${pivotX} ${pivotY})`);
        const card = document.createElementNS('http://www.w3.org/2000/svg','rect');
        card.setAttribute('x', pivotX - cardW/2);
        card.setAttribute('y', pivotY - cardH - 56);
        card.setAttribute('width', cardW);
        card.setAttribute('height', cardH);
        card.setAttribute('rx', 3);
        card.setAttribute('fill', i%2===0 ? '#8a1f2b' : '#6e1720');
        card.setAttribute('stroke', '#f0d896');
        card.setAttribute('stroke-width', '0.75');
        wrap.appendChild(card);
        // a small diamond motif on each card back, like a real card-back pattern
        const motif = document.createElementNS('http://www.w3.org/2000/svg','circle');
        motif.setAttribute('cx', pivotX);
        motif.setAttribute('cy', pivotY - 56 - cardH/2);
        motif.setAttribute('r', 3.2);
        motif.setAttribute('fill', '#f0d896');
        motif.setAttribute('opacity', '0.85');
        wrap.appendChild(motif);
        g.appendChild(wrap);
      }
    })();
  </script>
</body>
</html>
